tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: Create a new contact for the authenticated user. The photo can be uploaded as a multipart form-data file.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../components/schemas/contact.yaml#/ContactMultipartRequest'
responses:
  '201':
    description: Contact created successfully.
  '400':
    description: Bad request.
