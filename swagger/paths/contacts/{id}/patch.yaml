tags:
  - Contacts
summary: Update a contact
operationId: patchContact
description: Update a contact belonging to the authenticated user. Only the fields that should be changed need to be provided. The photo can be uploaded as a multipart form-data file.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: The unique ID of the contact to update.
    schema:
      type: string
      example: 65f1a2b3c4d5e6f789012345
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            example: John Doe
          phoneNumber:
            type: string
            example: '+905551112233'
          email:
            type: string
            format: email
            minLength: 1
            example: john.doe@example.com
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully.
  '400':
    description: Bad request.
  '404':
    description: Contact not found.
