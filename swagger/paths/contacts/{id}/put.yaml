tags:
  - Contacts
summary: Create or update a contact
operationId: upsertContact
description: Create a new contact or update an existing contact for the authenticated user. The photo may be uploaded as a multipart form-data file.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: The unique ID of the contact to create or update.
    schema:
      type: string
      example: 65f1a2b3c4d5e6f789012345
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            example: John Doe
          phoneNumber:
            type: string
            pattern: '^\+?[0-9]{7,15}$'
            example: '+905551112233'
          email:
            type: string
            format: email
            example: john.doe@example.com
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum:
              - work
              - home
              - personal
            example: work
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Existing contact updated successfully.
  '201':
    description: New contact created successfully.
  '400':
    description: Bad request.
  '404':
    description: Contact not found.
