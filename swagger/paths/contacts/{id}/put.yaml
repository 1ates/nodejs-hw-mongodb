tags:
  - Contacts
summary: Create or update a contact
operationId: upsertContact
description: Create a new contact or update an existing contact for the authenticated user. The photo can be uploaded as a multipart form-data file.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: The unique ID of the contact to create or update.
    schema:
      type: string
      example: 65f1a2b3c4d5e6f789012345
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../../components/schemas/contact.yaml#/ContactMultipartRequest'
responses:
  '200':
    description: Existing contact updated successfully.
  '201':
    description: New contact created successfully.
  '400':
    description: Bad request.
  '404':
    description: Contact not found.
